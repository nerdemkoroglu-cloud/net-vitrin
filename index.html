<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>net-vitrin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="brand">
    <model-viewer class="header-logo" src="modeller/net-vitrin.glb" auto-rotate rotation-per-second="30deg" camera-controls="false" disable-zoom interaction-prompt="none"></model-viewer>
    <span class="brand-text">NET-VİTRİN</span>
  </div>
  <nav class="site-nav">
    <a href="urunler.html">Ürünler</a>
    <a href="urunler.html#iletisim">İletişim</a>
  </nav>
</header>

<section class="landing">
  <div class="landing-content">
    <model-viewer class="landing-logo" src="modeller/net-vitrin.glb" auto-rotate rotation-per-second="30deg" camera-controls="false" disable-zoom interaction-prompt="none"></model-viewer>
    <h1 class="landing-title">NET-VİTRİN</h1>
    <p class="landing-desc">3D tasarımlarımı inceleyebileceğin, beğendiğin ürünü sipariş talebine dönüştürebileceğin vitrin. Kendi tasarımlarım, seçili hazır modeller ve sana özel üretimler burada.</p>
    <a href="urunler.html" class="btn-primary landing-btn">ÜRÜNLERİ İNCELE</a>
  </div>
</section>

<footer class="site-footer">
  <p>Sorularınız için: <a href="mailto:nerdemkoroglu@gmail.com">nerdemkoroglu@gmail.com</a></p>
  <p id="surumBilgisi" style="font-size:10px; color:var(--ink-dim); margin-top:8px;"></p>
</footer>

<script>
  fetch("https://script.google.com/macros/s/AKfycbwtZRC8W1zKp8Vyox-vHhb9WIUyF9lskFBID6g0LmovKUodXA6vK2y4vdZqVHPVMVs/exec?anahtar=Parola.08")
    .then(r => r.json())
    .then(veri => {
      const el = document.getElementById("surumBilgisi");
      if (el && veri.surumBilgisi && veri.surumBilgisi.surum) {
        el.textContent = `${veri.surumBilgisi.surum} · ${veri.surumBilgisi.tarih} ${veri.surumBilgisi.saat}`;
      }
    })
    .catch(() => {});
</script>

</body>
</html>
